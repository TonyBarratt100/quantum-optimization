[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "qaoa-maxcut"
version = "0.1.0"
description = "Solve MaxCut with QAOA in Qiskit"
readme = "README.md"
license = "MIT"
authors = [{ name = "Tony Barratt" }]
requires-python = ">=3.11"
dependencies = [
    "qiskit>=2.6,<3",
    "qiskit-aer>=0.18,<0.19",
    "numpy>=2.0",
    "scipy>=1.13",
    "matplotlib>=3.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.16,<0.17"]

[tool.setuptools]
packages = ["qaoa_maxcut"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
# pycodestyle, pyflakes, isort, bugbear, pyupgrade, naming, simplify, ruff-specific
select = ["E", "W", "F", "I", "B", "UP", "N", "SIM", "RUF"]
allowed-confusables = ["–"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["N802"]
